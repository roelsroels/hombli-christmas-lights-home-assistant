2222333","333300000003330003333000","333333330003330000000333","333300003333330003333000","333300003333330003333000","333300003330000003333000","-33300003330000003333000","-33300000003333333333000","-33300003333330003333000","-33311113330000003333333","-33300003330000003333000"],"Luminous Lagoon":["222222220002220000000222","222220000002221111222222","222220000002220000222222","-22222220002220000222222","222222220002220000000222","222222220002220000000222","222220000002220000000222","222220000000000000333111","222220002223330000222222","222222220002220000111222","222221110002220000222222","222220000002220000222222","222220000002220000222222","222220000002220000222000","222220001110000000222000","222220000002220000222111","222220002222220000222333","222220000002220000222222"]};
                  const scene = entity.state || 'Not set yet';
                  const colors = palettes[scene] || ['#666666', '#999999'];
                  const recorded = captures[scene];
                  const speedEntity = states['number.hombli_christmas_lights_animation_speed'];
                  const brightnessEntity = states['number.hombli_christmas_lights_scene_brightness'];
                  const powerEntity = states['light.hombli_smart_christmas_lights_rgb'];
                  const isOff = !powerEntity || powerEntity.state !== 'on';
                  const speed = Math.max(1, Math.min(100, Number(speedEntity?.state || 50)));
                  const brightness = Math.max(0.08, Math.min(1, Number(brightnessEntity?.state || 85) / 100));
                  // The reference was captured at speed 50. Scale playback around that point.
                  const duration = Math.max(1.2, Math.min(20, 8 * (50 / speed)));
                  const smoothScenes = new Set([
                    'Rainbow Cascade', 'Dreamland', 'Coral Reef', 'Aurora Borealis',
                    'Celestial Symphony', 'Water fountain', 'Candle Light', 'Shiny pearls',
                    'Winter Whirlwind', 'Harmonic Hues', 'Radiant Rhapsody', 'Prismatic Play',
                    'Cosmic Pulse', 'Soul pulse', 'Nordic pulse', 'Fire storm', 'Ocean Breeze',
                    'Snowy grasslands', 'The hulk', 'Vibrant Vortex', 'Glowing lanterns',
                    'Cherry wave', 'Dragon dance', 'Space alien', 'Mistery Mix', 'Luminous Lagoon'
                  ]);
                  const calcMode = smoothScenes.has(scene) ? 'linear' : 'discrete';
                  const alphabet = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
                  const count = 18;
                  const fallback = Array.from({length: count}, (_, i) => String(i % colors.length).repeat(24));
                  const tracks = recorded || fallback;
                  const bulbs = isOff
                    ? Array.from({length: count}, (_, index) => {
                        const x = 18 + index * 33;
                        return `<circle cx="${x}" cy="33" r="5.5" fill="var(--disabled-text-color, #777777)" opacity="0.5"/>`;
                      }).join('')
                    : tracks.map((track, index) => {
                    const statesList = [...track];
                    let lastColor = colors[index % colors.length];
                    const fillValues = statesList.map(token => {
                      const colorIndex = alphabet.indexOf(token);
                      if (colorIndex >= 0 && colors[colorIndex]) lastColor = colors[colorIndex];
                      return lastColor;
                    }).join(';');
                    const opacityValues = statesList.map(token => token === '-' ? Math.max(0.025, brightness * 0.055).toFixed(3) : brightness.toFixed(3)).join(';');
                    const radiusValues = statesList.map(token => token === '-' ? '3.5' : '7.5').join(';');
                    const firstColorIndex = alphabet.indexOf(statesList.find(token => token !== '-') || '0');
                    const firstColor = colors[Math.max(0, firstColorIndex)] || colors[0];
                    const x = 18 + index * 33;
                    return `<circle cx="${x}" cy="33" r="7.5" fill="${firstColor}" filter="url(#hombliGlow)">
                      <animate attributeName="fill" values="${fillValues}" dur="${duration.toFixed(2)}s" calcMode="${calcMode}" repeatCount="indefinite"/>
                      <animate attributeName="opacity" values="${opacityValues}" dur="${duration.toFixed(2)}s" calcMode="${calcMode}" repeatCount="indefinite"/>
                      <animate attributeName="r" values="${radiusValues}" dur="${duration.toFixed(2)}s" calcMode="${calcMode}" repeatCount="indefinite"/>
                    </circle>`;
                      }).join('');
                  return `<svg viewBox="0 0 600 66" preserveAspectRatio="none" style="display:block;width:100%;height:66px">
                    <defs>
                      <filter id="hombliGlow" x="-100%" y="-100%" width="300%" height="300%">
                        <feGaussianBlur stdDeviation="4" result="blur"/>
                        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
                      </filter>
                    </defs>
                    <path d="M12 33 H588" stroke="var(--divider-color)" stroke-width="3" opacity="0.7"/>
                    ${bulbs}
                  </svg>`;
                ]]]
